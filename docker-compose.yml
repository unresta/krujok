services:
  bot:
    build: .
    container_name: krujok
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db   # overrides whatever .env says, the volume is here
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
